<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>doyz-ai</title></head><body>
<div id="splash"><div class="sLogo">DZ</div><div class="sBar"><div id="sBarF"></div></div></div>
<div id="loginPage"><div class="card ios"><div style="text-align:center"><span class="glow">DOYZ AI</span><br><small id="subLogo" style="font-size:11px;font-weight:800;letter-spacing:3px;background:linear-gradient(90deg,#00f2ff,#00ff88);-webkit-background-clip:text;-webkit-text-fill-color:transparent">doyz auto</small></div><input id="usn" placeholder="Username"><input id="pw" type="password" placeholder="Password"><div id="err" style="display:none;color:#00f2ff;font-size:11px;margin-top:8px;text-align:center;font-weight:800;background:#00f2ff15;padding:6px;border-radius:8px"></div><button id="loginBtn">MASUK 🚀</button></div></div>
<div id="home" style="display:none"><div class="card ios"><div class="avatar">DZ</div><div style="text-align:center"><span class="glow2">DOYZ AI</span><br><small id="usnDisplay">@DOYZ</small></div><button id="showBtn">🚀 KELUARIN PANEL & BULET</button><button id="logout" style="background:#ff5a5a22">LOGOUT</button></div></div>
<div id="floatBtn"><span>DZ</span><div class="ring"></div></div>
<div id="backdrop"></div>
<div id="panel"><div id="head"><span id="panelTitle">doyz-ai • @DOYZ</span><div style="display:flex;gap:6px"><span id="minBtn" class="dot y">—</span><span id="closeBtn" class="dot r">✕</span></div></div><div id="body"><select id="mapel"><option>IPA</option><option>MTK</option><option>IPS</option><option>B.INDO</option><option>B.ING</option><option>PJOK</option><option>PRAK</option><option>SBK</option><option>PAI</option><option>TIK</option></select><div class="nGrid"><button class="nBtn" data-v="75">75</button><button class="nBtn" data-v="80">80</button><button class="nBtn active" data-v="85">85</button><button class="nBtn" data-v="90">90</button><button class="nBtn" data-v="95">95</button><button class="nBtn" data-v="100">100</button></div><div class="nBig" id="nOut">85</div><button id="autoBtn">🤖 AUTO: OFF</button><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><button id="scanScreenBtn" style="background:linear-gradient(90deg,#00ff88,#00f2ff);color:#000">🖥️ SCAN LAYAR LIVE</button><button id="fileBtn" style="background:#ffffff15">📁 FILE DALAM APK</button></div><input type="file" id="fileInput" accept="image/*" style="display:none"><video id="v" style="display:none" autoplay muted playsinline></video><canvas id="c" style="display:none"></canvas><div id="prevBox" style="display:none"><img id="preview"><div id="ocr"></div></div><div id="ansBox" style="display:none"><b id="ansT"></b><div id="ans"></div><button id="copyBtn">📋 Copy</button></div><button id="hideBtn" style="background:#ffffff0f">👁️ TAK TERLIHAT</button></div></div>
<div id="hint">READY ⚡</div>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 0%,#2a1a5a,#050510);min-height:100vh;color:#fff;font-family:system-ui;display:flex;align-items:center;justify-content:center;overflow:hidden}
#splash{position:fixed;inset:0;background:#050510;z-index:999999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:.6s}#splash.out{opacity:0;transform:scale(1.1);pointer-events:none}
.sLogo{width:90px;height:90px;border-radius:50%;background:linear-gradient(135deg,#00f2ff,#7a00ff);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:34px;animation:sp 1s infinite}@keyframes sp{50%{transform:scale(1.08);box-shadow:0 0 30px #00f2ff88}}
.sBar{width:120px;height:3px;background:#fff1;border-radius:10px;margin-top:20px;overflow:hidden}#sBarF{width:0%;height:100%;background:linear-gradient(90deg,#00f2ff,#7a00ff);animation:ld 1.4s forwards}@keyframes ld{to{width:100%}}
.card{width:380px;max-width:92vw;background:rgba(20,20,40,.92);backdrop-filter:blur(20px);border:1px solid #ffffff18;border-radius:24px;padding:22px;box-shadow:0 20px 60px #0008}.ios{animation:ios.7s cubic-bezier(.32,.72,0,1)}@keyframes ios{from{transform:scale(.88) translateY(40px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.glow{font-size:36px;font-weight:1000;letter-spacing:2px;background:linear-gradient(90deg,#ff0000,#ff7f00,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000);background-size:400% 400%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:1.2px #ffffff40;filter:drop-shadow(0 0 12px #00f2ff88) drop-shadow(0 0 20px #ff00ff66);animation:rainbow 3s linear infinite,tebel 1.5s ease-in-out infinite;display:inline-block}
.glow2{font-size:28px;font-weight:1000;letter-spacing:2px;background:linear-gradient(90deg,#ff0000,#ff7f00,#ffff00,#00ff00,#00ffff,#0000ff,#ff00ff,#ff0000);background-size:400% 400%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;-webkit-text-stroke:1px #ffffff40;filter:drop-shadow(0 0 10px #00f2ff88);animation:rainbow 3s linear infinite;display:inline-block}
@keyframes rainbow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}@keyframes tebel{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.avatar{width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#00f2ff,#7a00ff);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:28px;margin:0 auto 10px;animation:pulse 2s infinite}@keyframes pulse{50%{transform:scale(1.05)}}
input,select{width:100%;padding:13px;border-radius:14px;border:1px solid #ffffff18;background:#0005;color:#fff;margin-top:8px}button{width:100%;padding:13px;border-radius:14px;border:0;background:linear-gradient(90deg,#00f2ff,#7a00ff);color:#fff;font-weight:900;margin-top:10px;cursor:pointer}
#floatBtn,#panel{will-change:transform;transform:translate3d(0,0,0);backface-visibility:hidden;contain:layout style paint}
#floatBtn{position:fixed;left:0;top:0;width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#00f2ff,#7a00ff);z-index:99999;display:none;align-items:center;justify-content:center;cursor:grab;box-shadow:0 0 0 4px #ffffff15,0 10px 30px #7a00ff88;touch-action:none}#floatBtn.show{display:flex;animation:bb.6s cubic-bezier(.32,.72,0,1)}@keyframes bb{0%{transform:translate3d(var(--x),var(--y),0) scale(0)}100%{transform:translate3d(var(--x),var(--y),0) scale(1)}}#floatBtn.hide{animation:hh.35s forwards}@keyframes hh{to{transform:translate3d(var(--x),var(--y),0) scale(0);opacity:0}}.ring{position:absolute;inset:-6px;border-radius:50%;border:2px solid #00f2ff;animation:ping 1.5s infinite}@keyframes ping{100%{transform:scale(1.5);opacity:0}}
#panel{position:fixed;left:0;top:0;width:380px;max-width:93vw;max-height:85vh;background:rgba(15,15,35,.97);backdrop-filter:blur(40px);border:1px solid #ffffff18;border-radius:28px;z-index:99991;display:none;flex-direction:column;overflow:hidden;opacity:0;transition:opacity.35s}#panel.show{display:flex;opacity:1}#head{padding:14px;display:flex;justify-content:space-between;border-bottom:1px solid #ffffff10;font-weight:800;cursor:grab;background:#ffffff05;touch-action:none}#body{padding:12px;overflow:auto;flex:1}.dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}.r{background:#ff5f57;color:#000}.y{background:#ffcc02;color:#000}
.nGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.nBtn{background:#ffffff0f;border:1px solid #ffffff12;padding:10px;border-radius:12px}.nBtn.active{background:linear-gradient(135deg,#00f2ff,#7a00ff)}.nBig{font-size:44px;text-align:center;font-weight:900;margin:6px 0;background:linear-gradient(90deg,#00f2ff,#ff00ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#preview{width:100%;border-radius:12px;max-height:120px;object-fit:cover;margin-top:8px}#ocr{font-size:11px;background:#0008;padding:8px;border-radius:8px;margin-top:6px;max-height:60px;overflow:auto}#ansBox{margin-top:10px;background:#ffffff12;border:1px solid #00f2ff33;border-radius:14px;padding:12px}#ans{font-size:13px;white-space:pre-wrap;line-height:1.4}
#backdrop{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:99990;display:none}#backdrop.show{display:block;backdrop-filter:blur(14px)}#hint{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#00f2ff;color:#000;padding:10px 18px;border-radius:30px;font-weight:900;font-size:11px;z-index:99992;opacity:0;transition:.5s}#hint.show{transform:translateX(-50%) translateY(0);opacity:1}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);let cur=null,nilai=85,auto=false,autoI=null,last='',pos={x:100,y:100},ppos={x:20,y:80},vis=false,taps=[],rafFloat=null,rafPanel=null,liveStream=null,liveInterval=null,isLive=false;
window.onload=()=>{setTimeout(()=>{$('splash').classList.add('out');setTimeout(()=>$('splash').style.display='none',600)},1400)};
$('loginBtn').onclick=()=>{let u=$('usn').value.trim().toLowerCase(),p=$('pw').value.trim(),err=$('err');if(!u||!p){err.style.display='block';err.innerText='buy ke tt @plermelayang';return;}if(u==='doyz'&&p==='123'){cur=$('usn').value.trim();err.style.display='none';$('usnDisplay').innerText='@'+cur.toUpperCase();$('panelTitle').innerText='doyz-ai • @'+cur.toUpperCase();$('subLogo').innerText='@'+cur.toUpperCase();$('loginPage').animate([{opacity:1},{opacity:0}],{duration:300}).onfinish=()=>{$('loginPage').style.display='none';$('home').style.display='block';};}else{err.style.display='block';err.innerText='buy ke tt @plermelayang';}};
$('logout').onclick=()=>location.reload();
function setPos(el,p){el.style.setProperty('--x',p.x+'px');el.style.setProperty('--y',p.y+'px');el.style.transform=`translate3d(${p.x}px,${p.y}px,0)`;}
function showF(){if(vis)return;vis=true;let f=$('floatBtn');f.style.display='flex';setPos(f,pos);f.classList.remove('hide');void f.offsetWidth;f.classList.add('show')}
function hideF(){let f=$('floatBtn');f.classList.remove('show');f.classList.add('hide');setTimeout(()=>{f.style.display='none';vis=false},320);hideP();let h=$('hint');h.innerText='BULET ILANG - 3x TAP KOSONG MUNCUL LAGI';h.classList.add('show');setTimeout(()=>h.classList.remove('show'),3000)}
function showP(){let p=$('panel'),b=$('backdrop');setPos(p,ppos);p.style.display='flex';b.style.display='block';void p.offsetWidth;p.classList.add('show');b.classList.add('show')}
function hideP(){let p=$('panel'),b=$('backdrop');p.classList.remove('show');b.classList.remove('show');setTimeout(()=>{p.style.display='none';b.style.display='none'},350)}
$('showBtn').onclick=()=>{showF();setTimeout(showP,350)};$('floatBtn').onclick=()=>{$('panel').classList.contains('show')?hideP():showP()};$('closeBtn').onclick=hideP;$('minBtn').onclick=hideP;$('backdrop').onclick=hideP;$('hideBtn').onclick=hideF;
document.addEventListener('pointerdown',e=>{if(!cur||vis)return;if(e.target.closest('#floatBtn,#panel,#loginPage,#home,#splash,button,input,select'))return;let now=Date.now();taps=taps.filter(t=>now-t<900);taps.push(now);if(taps.length>=3){taps=[];showF();}});
function drag120(el,pO){let a=false,sx,sy,bx,by,cx,cy;let head=el===$('floatBtn')?el:$('head');head.addEventListener('pointerdown',e=>{if(e.target.closest('.dot'))return;a=true;head.setPointerCapture(e.pointerId);sx=e.clientX;sy=e.clientY;bx=pO.x;by=pO.y;el.style.transition='none';},{passive:false});window.addEventListener('pointermove',e=>{if(!a)return;cx=bx+(e.clientX-sx);cy=by+(e.clientY-sy);pO.x=cx;pO.y=cy;let r=el===$('floatBtn')?rafFloat:rafPanel;if(r)cancelAnimationFrame(r);let nr=requestAnimationFrame(()=>setPos(el,pO));if(el===$('floatBtn'))rafFloat=nr;else rafPanel=nr;},{passive:true});window.addEventListener('pointerup',()=>{a=false;el.style.transition='';},{passive:true});}
drag120($('floatBtn'),pos);drag120($('panel'),ppos);setPos($('floatBtn'),pos);setPos($('panel'),ppos);
document.querySelectorAll('.nBtn').forEach(b=>{b.onclick=()=>{document.querySelectorAll('.nBtn').forEach(x=>x.classList.remove('active'));b.classList.add('active');nilai=parseInt(b.dataset.v);$('nOut').innerText=nilai}});

// OCR + AUTO JAWAB
async function doOCR(src,isLiveMode=false){
  $('prevBox').style.display='block';
  if(!isLiveMode) $('ocr').innerText='🔍 Membaca...';
  try{
    const{data:{text}}=await Tesseract.recognize(src,'ind+eng');
    if(!text.trim()){ if(!isLiveMode) $('ocr').innerText='Tidak terbaca'; return; }
    if(text===last) return;
    $('ocr').innerText=(isLiveMode?'🔴 LIVE: ':'')+text.slice(0,120);
    ansAI(text);
  }catch{ if(!isLiveMode) $('ocr').innerText='Gagal'; }
}
function ansAI(t){
  $('ansBox').style.display='block';
  $('ansT').innerText=`JAWABAN ${$('mapel').value} - NILAI ${nilai} - @${cur}`;
  $('ans').innerText='🤖 Lagi jawab otomatis...';
  setTimeout(()=>{
    let m=$('mapel').value,q=t.slice(0,300),jawab='';
    if(nilai<=80) jawab=`Jawaban singkat ${m}:\n${q}\n\n-> ${q.split(' ').slice(0,20).join(' ')}... [nilai ${nilai}]`;
    else if(nilai<=90) jawab=`Diketahui: ${q}\n\nJawab (${nilai}):\n1. ${q.slice(0,100)}\n2. Penjelasan ${m}: ${q.split(' ').slice(0,10).join(' ')}\n3. Kesimpulan\n\n@${cur}`;
    else jawab=`[MAPEL: ${m}] [NILAI: ${nilai}] [LIVE]\n\nSoal: ${q}\n\nPEMBAHASAN LENGKAP:\n1. Analisis: ${q}\n2. Konsep: ${q.slice(0,120)}...\n3. Jawaban Nilai ${nilai}:\n- Poin A: ${q.split(' ').slice(0,12).join(' ')}\n- Poin B: Uraian terstruktur\n- Poin C: Kesimpulan\n\n@${cur} • live`;
    $('ans').innerText=jawab; last=t;
  },400);
}

// FILE DALAM APK
$('fileBtn').onclick=()=>$('fileInput').click();
$('fileInput').onchange=e=>{let f=e.target.files[0]; if(!f) return; let u=URL.createObjectURL(f); $('preview').src=u; doOCR(f,false);};

// SCAN LAYAR LIVE BENERAN
$('scanScreenBtn').onclick=async()=>{
  if(isLive){
    isLive=false; $('scanScreenBtn').innerText='🖥️ SCAN LAYAR LIVE'; $('scanScreenBtn').style.background='linear-gradient(90deg,#00ff88,#00f2ff)';
    if(liveStream) liveStream.getTracks().forEach(t=>t.stop()); if(liveInterval) clearInterval(liveInterval);
    let h=$('hint'); h.innerText='LIVE STOP'; h.classList.add('show'); setTimeout(()=>h.classList.remove('show'),2000); return;
  }
  try{
    liveStream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30}, audio:false});
    let v=$('v'); v.srcObject=liveStream; await v.play(); isLive=true;
    $('scanScreenBtn').innerText='🔴 STOP LIVE'; $('scanScreenBtn').style.background='#ff3b3b';
    let h=$('hint'); h.innerText='🔴 LIVE AKTIF - SCAN TIAP 1.5 DETIK'; h.classList.add('show'); setTimeout(()=>h.classList.remove('show'),3000);
    liveInterval=setInterval(()=>{ if(!isLive) return; let c=$('c'); c.width=v.videoWidth; c.height=v.videoHeight; c.getContext('2d').drawImage(v,0,0); let u=c.toDataURL('image/jpeg',0.8); $('preview').src=u; doOCR(u,true); },1500);
    liveStream.getVideoTracks()[0].onended=()=>{isLive=false; $('scanScreenBtn').innerText='🖥️ SCAN LAYAR LIVE'; $('scanScreenBtn').style.background='linear-gradient(90deg,#00ff88,#00f2ff)'; clearInterval(liveInterval);};
  }catch{ alert('Kasih izin rekam layar pung'); }
};

$('autoBtn').onclick=()=>{
  auto=!auto; $('autoBtn').innerText=auto?'🤖 AUTO: ON - LIVE DALAM APK':'🤖 AUTO: OFF'; $('autoBtn').style.background=auto?'#00ff88':'#000'; $('autoBtn').style.color=auto?'#000':'#00f2ff';
  if(auto){ autoI=setInterval(()=>{ let big=''; document.querySelectorAll('div,p,span,li').forEach(el=>{ let t=el.innerText; if(!t||t.length<30||t.length>600) return; if(t.includes('?')||/jelaskan|apa|mengapa|hitung|sebutkan|uraikan/i.test(t)){ if(t.length>big.length) big=t; } }); if(big&&big!==last&&big.length>30){ $('prevBox').style.display='block'; $('ocr').innerText='🤖 AUTO APK: '+big.slice(0,120); ansAI(big); } },2000);}else clearInterval(autoI);
};
$('copyBtn').onclick=()=>{navigator.clipboard.writeText($('ans').innerText);$('copyBtn').innerText='✅ Copied'; setTimeout(()=>$('copyBtn').innerText='📋 Copy',1000);};
</script></body></html>
